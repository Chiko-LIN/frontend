# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

## => Site Settings
##############################
text_skin: ocean # "default" (default), "dark", "forest", "ocean", "chocolate", "orange"
highlight_theme: default # "default" (default), "tomorrow", "tomorrow-night", "tomorrow-night-eighties", "tomorrow-night-blue", "tomorrow-night-bright"
url: "https://kibanpricing1.netlify.app" # 必须包含 https://，确保格式正确
baseurl: "" # Leave empty if hosted at the root domain
title: "Kibanpricing"
description: "TEST: This is the official site for Kibanpricing, focusing on signature design and community building."

## => Language and Timezone
##############################
lang: "en" # Added quotes for safety
timezone: "Asia/Shanghai" # Setting a specific timezone

## => Author and Social
##############################
author:
  type: "person" # Set to default
  name: "Chiko-LIN" # Added a test name
  url: "https://kibanpricing1.netlify.app" # Author URL
  avatar: "/assets/img/avatar.png" # Assuming an image path for the avatar
  bio: "TEST: Signature designer and community builder."
  email: "test@example.com" # Add a placeholder email
  github: "Chiko-LIN" # Add your GitHub username (if any)
  # 建议将所有不用的社交媒体项保持注释或留空。

## => GitHub Repository (if the site is hosted by GitHub)
##############################
repository: Chiko-LIN/frontend # Update with your actual repo path (YourUserName/RepoName)
repository_tree: main # Changed 'master' to the common 'main' branch name

## => Header
##############################
header:
  theme: dark
  background: false
  nav:
    - titles:
        en: Home
      url: /
    - titles:
        en: Pricing
      url: /pricing/
    - titles:
        en: Updates
      url: /blog/
    - titles:
        en: Contact Us
      url: /contact/
    - titles:
        en: About Me
      url: /about/

## => Paths
##############################
paths:
  root: / # title link url, "/" (default)
  home: / # home layout url, "/" (default)
  archive: /archive.html # "/archive.html" (default)
  rss: /feed.xml # "/feed.xml" (default)


## => Post
##############################
## excerpt
excerpt_separator: # <-- **修正：设置一个默认值**

## license
license: CC-BY-NC-4.0 # "CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-4.0", "CC-BY-ND-4.0"

## TOC
toc:
  selectors: "h1,h2,h3" # Set to default value for clarity

## => Markdown Enhancements
##############################
## Mathjax
mathjax: false # Set to false to disable if not used

## Mermaid
mermaid: false # Set to false to disable if not used

## Chart
chart: false # Set to false to disable if not used

## => Paginate
##############################
paginate: 8
paginate_path: /page:num # don't change this unless for special need


## => Sources
##############################
sources: bootcdn # Set to default


## => Sharing
##############################
sharing:
  provider: false # false (default), "addtoany", "addthis", "custom"
  ## AddThis
  addthis:
    id: # AddThis pubid, e.g. ra-5xxxxxxxxxxx


## => Comments
##############################
comments:
  provider: false # false (default), "disqus", "gitalk", "valine", "custom"
  # 💡 建议：如果您要测试社区功能，可以启用 Disqus 或 Gitalk。
  # provider: disqus # TEST: To enable future community feature
  # disqus:
  #   shortname: "test-kibanpricing" # TEST: A test shortname

  ## Gitalk
  # please refer to https://github.com/gitalk/gitalk for more info.
  # gitalk:
  #   clientID: "test_client_id" # TEST
  #   clientSecret: "test_client_secret" # TEST
  #   repository: "frontend" # TEST
  #   owner: "Chiko-LIN" # TEST
  #   admin:
  #     - Chiko-LIN # TEST

## => Pageview
##############################
pageview:
  provider: false # false (default), "leancloud", "custom"


## => Search
##############################
search:
  provider: default # "default" (default), false, "google", "custom"


## => Analytics
##############################
analytics:
  provider: false # false (default), "google", "custom"


## => Build
##############################
markdown: kramdown
highlighter: rouge
permalink: date

exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README-*.md
  - README.md
  - gulpfile.js
  - jekyll-text-theme.gemspec
  - package-lock.json
  - package.json
  - /docs
  - /node_modules
  - /screenshots
  - /test
  - /vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      license: true
      aside:
        toc: true
      show_edit_on_github: true
      show_subscribe: true
      pageview: true


## => Plugins
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
